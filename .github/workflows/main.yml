name: Main build

# Builds the installable ZIP from main as a workflow artifact. Signed releases are added in M9 (TODO.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2
        coverage: none
    - uses: actions/setup-node@v7
      with:
        node-version-file: apps/admin/.nvmrc
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - run: bash bin/build-zip.sh "$RUNNER_TEMP/dist"
    - uses: actions/upload-artifact@v7
      with:
        name: sw-postlist-zip
        path: ${{ runner.temp }}/dist/*.zip
        if-no-files-found: error
        retention-days: 14
